[package]
name = "scd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scd"
path = "src/main.rs"

[dependencies]
sc-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
interprocess.workspace = true
notify.workspace = true
crossbeam-channel.workspace = true
directories.workspace = true
png = "0.18.1"

# Capture + encode pipeline: portal/PipeWire/VA-API on Linux, Windows Graphics
# Capture/WASAPI/NVENC-AMF-QSV on Windows.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
sc-capture = { path = "../sc-capture" }
sc-ffmpeg = { path = "../sc-ffmpeg" }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Registry", "Win32_Media_Audio", "Win32_System_LibraryLoader", "Win32_System_Time", "Win32_System_Console", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell"] }
winreg = "0.56.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
