[package]
name = "sc-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sc-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true

# The portal + PipeWire capture path is Linux-only (Phase 1). Windows (WGC) is a
# separate backend in Phase 4; this crate is a no-op there.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["screencast", "async-io"] }
pipewire = "0.10"
libspa = "0.10"
pollster = "1"
enumflags2 = "0.7"

[target.'cfg(target_os = "linux")'.dev-dependencies]
sc-ffmpeg = { path = "../sc-ffmpeg" }
