[package]
name = "sc-voice"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sc-voice"
path = "src/main.rs"

[dependencies]
sc-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
interprocess.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Speech", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant"] }
