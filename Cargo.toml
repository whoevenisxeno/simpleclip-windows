[workspace]
resolver = "2"
members = ["crates/sc-core", "crates/scd", "crates/sc", "crates/sc-gui", "crates/sc-ffmpeg"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/whoevenisxeno/SimpleClip"
authors = ["SimpleClip contributors"]

[workspace.dependencies]
sc-core = { path = "crates/sc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
interprocess = "2"
notify = "8"
toml = "0.8"
directories = "6"
crossbeam-channel = "0.5"
ffmpeg-next = "8.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
