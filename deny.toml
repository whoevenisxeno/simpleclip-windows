[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive default build. GPL-only components (e.g. x264) are gated behind an
# opt-in Cargo feature; a build with those enabled is GPL and is checked separately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # ffmpeg-next / ffmpeg-sys-next Rust wrappers. The linked FFmpeg library is
    # system LGPL (not a cargo dep); these bindings are WTFPL (permissive).
    "WTFPL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
